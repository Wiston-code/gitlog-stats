name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test (saved log)
        run: gitlog-stats --file examples/sample_gitlog.txt --no-chart

      - name: Smoke test (this repository)
        run: gitlog-stats . --json
