[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlog-stats"
version = "0.1.0"
description = "Report activity from a git history: authors, months, hours, streaks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wiston" }]
keywords = ["git", "cli", "statistics", "productivity", "report"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Wiston-code/gitlog-stats"
Issues = "https://github.com/Wiston-code/gitlog-stats/issues"

[project.scripts]
gitlog-stats = "gitlog_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
